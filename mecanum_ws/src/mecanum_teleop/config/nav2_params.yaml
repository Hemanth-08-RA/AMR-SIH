# ============================================================
# PHYSICAL MECANUM ROBOT - NAV2 PARAMETERS
# ROS 2 HUMBLE
# ============================================================

bt_navigator:
  ros__parameters:

    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link

    odom_topic: /odom

    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml" 

    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml" 


# ============================================================
# CONTROLLER SERVER
# ============================================================

controller_server:
  ros__parameters:

    use_sim_time: false

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    enable_stamped_cmd_vel: true

    odom_topic: /odom

    failure_tolerance: 0.3

    controller_plugins:
      - FollowPath

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - general_goal_checker

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20

      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      min_vel_x: -0.40
      max_vel_x: 0.40

      min_vel_y: -0.40
      max_vel_y: 0.40

      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.50
      min_speed_theta: 0.0
      max_speed_theta: 1.0

      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 2.0

      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -2.0

      vx_samples: 10
      vy_samples: 10
      vtheta_samples: 15

      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2

      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true

      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist


# ============================================================
# LOCAL COSTMAP
# ============================================================

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: false

      update_frequency: 8.0
      publish_frequency: 4.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.23, 0.20], [0.23, -0.20], [-0.23, -0.20], [-0.23, 0.20]]"

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          obstacle_min_range: 0.05
          raytrace_min_range: 0.05
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.35

      always_send_full_costmap: true


# ============================================================
# GLOBAL COSTMAP
# ============================================================

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: false

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05

      footprint: "[[0.23, 0.20], [0.23, -0.20], [-0.23, -0.20], [-0.23, 0.20]]"

      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          obstacle_min_range: 0.05
          raytrace_min_range: 0.05
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.35

      always_send_full_costmap: true


# ============================================================
# PLANNER
# ============================================================

planner_server:
  ros__parameters:

    use_sim_time: false

    expected_planner_frequency: 5.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

      tolerance: 0.20

      use_astar: false

      allow_unknown: true


# ============================================================
# BEHAVIOR SERVER
# ============================================================

behavior_server:
  ros__parameters:

    use_sim_time: false

    enable_stamped_cmd_vel: true

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"


# ============================================================
# SMOOTHER
# ============================================================

smoother_server:
  ros__parameters:

    use_sim_time: false

    smoother_plugins:
      - simple_smoother

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      tolerance: 1.0e-10

      max_its: 1000

      do_refinement: true


# ============================================================
# WAYPOINT FOLLOWER
# ============================================================

waypoint_follower:
  ros__parameters:

    use_sim_time: false

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: false

      waypoint_pause_duration: 0


# ============================================================
# VELOCITY SMOOTHER
# ============================================================

velocity_smoother:
  ros__parameters:

    use_sim_time: false

    smoothing_frequency: 20.0

    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity:
      - 0.50
      - 0.50
      - 1.00

    min_velocity:
      - -0.50
      - -0.50
      - -1.00

    max_accel:
      - 1.0
      - 1.0
      - 2.0

    max_decel:
      - -1.0
      - -1.0
      - -2.0

    odom_topic: /odom

    odom_duration: 0.1

    deadband_velocity:
      - 0.0
      - 0.0
      - 0.0

    velocity_timeout: 1.0


# ============================================================
# LIFECYCLE MANAGER
# ============================================================

lifecycle_manager:
  ros__parameters:

    use_sim_time: false

    autostart: true

    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
